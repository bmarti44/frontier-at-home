# Repo-local gitleaks config. Public integrity digests (sha256 of vendored
# public files) are not secrets; keep the allowlist as narrow as the exact
# JSON field that carries them.
[extend]
useDefault = true

[allowlist]
description = "public integrity digests recorded in exact evidence fields"
regexTarget = "line"
paths = [
  '''^scripts/103_verify_drand_receipt_bundle\.mjs$''',
]
regexes = [
  '''"(access_stream|binary|build_manifest|builder|configuration|diff|fixture|generated_content|generated_reasoning|inventory|launcher|model|output_tokenizer|pack|preserved_archive|profile|randomness_receipt|raw_artifact|receipt|request|response|runner|runtime_bundle|scorer|seed|server|source|staged_binary|terminal_receipt|test|test_diff|tokenizer|weights_manifest)_sha256": "[0-9a-f]{64}"''',
  '''"tokenizers_(init|so)_sha256": "[0-9a-f]{64}"''',
  '''"token_scorer_sha256": "[0-9a-f]{64}"''',
  '''"tokenizer_sha256":"[0-9a-f]{64}"''',
  '''"(off|on)/(measured|warm)\.tokens\.json": "[0-9a-f]{64}"''',
  '''"(unchanged_scorer|red_test)_sha256": "[0-9a-f]{64}"''',
  '''"test_output_sha256": "[0-9a-f]{64}"''',
  '''"(quality_binary|server_binary|partial_tsv|main_log|command_log|samples_log|engine_log|randomness)_sha256": "[0-9a-f]{64}"''',
  '''"randomness": "[0-9a-f]{64}"''',
  '''"lib[a-zA-Z0-9._-]+\.so": "[0-9a-f]{64}"''',
  '''"(base|mtp|dspark_drafter)": "[0-9a-f]{64}"''',
  '''"(results/glm52-(goal|gates)/harness/[a-zA-Z0-9._/-]+|scripts/(11_build_glm52_repro\.sh|30_bench_speed\.py))": "[0-9a-f]{64}"''',
  '''"results/glm52-goal/evidence/build-repro/[a-zA-Z0-9._/-]+": "[0-9a-f]{64}"''',
  '''"vendor/official-encoding/tokenizer\.json": "[0-9a-f]{64}"''',
  '''"scripts/lint_secrets\.sh": "[0-9a-f]{64}"''',
  '''"(freeze_json|response|tsa_certificate|ca_certificate)_sha256": "[0-9a-f]{64}"''',
  '''"(freeze|no-result-relative-path|success)/[a-zA-Z0-9._/-]+": "[0-9a-f]{64}"''',
  '''"drand_randomness": "[0-9a-f]{64}"''',
  '''"drand_signature": "[0-9a-f]{192}"''',
  '''"(calibration_keys|heldout_keys|heldout_queries)_sha256": "[0-9a-f]{64}"''',
  '''"signature": "[0-9a-f]{192}"''',
  '''"/home/dsv4/ds4-project/[^"]+": "[0-9a-f]{64}"''',
  '''^readonly SOURCE_SHA256=[0-9a-f]{64}$''',
  '''^readonly HARNESS_SHA256=[0-9a-f]{64}$''',
  '''^HARNESS_SHA256 = "[0-9a-f]{64}"$''',
  '''^(SCORER|TRACE_SCORER|DRAND_VERIFIER|DRAND_NODE|DRAND_RUNTIME_TREE)_SHA256 = "[0-9a-f]{64}"$''',
  '''^(BASE|BINARY|CGROUP|DRAND_BUNDLE|DRAND_NODE|DRAND_RUNTIME_TREE|DRAND_VERIFIER|LIVE|MEMORY_GUARD|MODEL|PRIMARY|SAFE|SCORER|SYSTEM_CA_BUNDLE)_SHA256 = "[0-9a-f]{64}"$''',
  '''^readonly SUBMITTER_SHA256=[0-9a-f]{64}$''',
  '''^readonly PYTHON_DEPENDENCY_SHA256=[0-9a-f]{64}$''',
  '''^readonly (TRACE_SCORER|TOKENIZER|TOKENIZER_INIT|TOKENIZER_NATIVE)_SHA256=[0-9a-f]{64}$''',
  '''^readonly (BINARY|STRICT_BINARY|MODEL|LIVE|PRIMARY|POOL|SCORER|CGROUP|SAFE|MEMORY_GUARD|ENGINE_FREEZE|CONFIGURATION|DRAND_VERIFIER|DRAND_NODE|DRAND_RUNTIME_TREE)_SHA256=[0-9a-f]{64}$''',
  '''^readonly (REQUEST|ENGINE_PATCH)_SHA256=[0-9a-f]{64}$''',
  '''^(PRIMARY|LIVE)_SHA(256)? = "[0-9a-f]{64}"$''',
  '''readonly TOKENIZER_INIT_SHA256=[0-9a-f]{64}''',
  '''readonly TOKENIZER_NATIVE_SHA256=[0-9a-f]{64}''',
  '''readonly TOKENIZER_SHA256=[0-9a-f]{64}''',
  '''^P1_PYTHON_DEPENDENCY_SHA256 = "[0-9a-f]{64}"$''',
  '''^MODEL_SHA256 = "[0-9a-f]{64}"$''',
  '''^(BINARY|ENV)_SHA256 = "[0-9a-f]{64}"$''',
  '''^MEMORY_GUARD_SHA256 = "[0-9a-f]{64}"$''',
  '''^readonly ENV_SHA256=[0-9a-f]{64}$''',
  '''^QUALITY_FIXTURE_CONTENT_SHA256 = "[0-9a-f]{64}"$''',
  '''^FROZEN_(BINARY|MODEL|TOKENIZER|FIXTURE|ROOT_SUBMITTER)_SHA256 = "[0-9a-f]{64}"$''',
  '''TOKENIZER_SHA256 = "[0-9a-f]{64}"''',
  '''^TOKENIZER_(INIT|NATIVE)_SHA256 = "[0-9a-f]{64}"$''',
  '''TOKENIZER_INIT_SHA256 = "[0-9a-f]{64}"''',
  '''TOKENIZER_NATIVE_SHA256 = "[0-9a-f]{64}"''',
  '''"(patch|engine_source|engine_test|ds4_cuda|state_header|state_header_engine_copy|acceptance_test|build_1_binary|build_2_binary)_sha256": "[0-9a-f]{64}"''',
  '''"(test|production_cuda_source|stdout|stderr)_sha256": "[0-9a-f]{64}"''',
  '''"(arm|off_arm|on_arm|on_server_log|off_containment|on_containment)_sha256": "[0-9a-f]{64}"''',
  '''"(off|on)_(ledger|responses)_sha256": "[0-9a-f]{64}"''',
  '''"(manifest|stdout_manifest)_sha256": "[0-9a-f]{64}"''',
  '''"(summary|runtime_final|checkpoint_chain_tail|console_log)_sha256": "[0-9a-f]{64}"''',
  '''"(model_manifest|diagnostic_events|runtime_start|run_log)_sha256": "[0-9a-f]{64}"''',
  '''"(splitter|source_manifest|source_output|split_plan|top_manifest)_sha256": "[0-9a-f]{64}"''',
  '''"(quality|long)_output_sha256": ("[0-9a-f]{64}"|\[)''',
  '''^      "(cmd|kernel|main|samples)_sha256": "[0-9a-f]{64}"[,]?$''',
  '''"(off_containment_stdout|off_containment_stderr|(off|on)_result_[12])_sha256": "[0-9a-f]{64}"''',
  '''"installer_sha256": "[0-9a-f]{64}"''',
  '''"(submitter|controller|approval|reservation|marker)_sha256": "[0-9a-f]{64}"''',
  '''"canonical_tree_sha256": "[0-9a-f]{64}"''',
  '''"reference_(continuation|token_ids)_sha256": "[0-9a-f]{64}"''',
  '''^                "wrapper_sha256": "[0-9a-f]{64}",$''',
  '''^_W7_SAFE_WRAPPER_SHA256 = "[0-9a-f]{64}"$''',
  '''^_W7_(STEM_FILE|STEM_TEXT|POOL|TOKENIZER_INIT|TOKENIZER_NATIVE|TOKENIZER)_SHA256 = "[0-9a-f]{64}"$''',
  '''_W7_TOKENIZER_(INIT|NATIVE)_SHA256 = "[0-9a-f]{64}"''',
  '''^(TOKENIZER|RUNTIME_INIT|RUNTIME_NATIVE)_SHA256 = "[0-9a-f]{64}"$''',
  '''"(sha256|wire_sha256)": ?"[0-9a-f]{64}"''',
  '''"full_log_sha256": "[0-9a-f]{64}"''',
  '''"checkpoint_id": "token-text:[0-9a-f]{40}"''',
  '''off\["checkpoint_id"\], "token-text:[0-9a-f]{40}"''',
  '''kv/[0-9a-f]{40}\.kv''',
  '''"safe_run_sha256": "[0-9a-f]{64}"''',
  '''"tree_sha256": "[0-9a-f]{64}"''',
  '''"scripts/tests/test_w4_serving_campaign_(runner|scorer)\.py": "[0-9a-f]{64}"''',
  '''"b[0-4]s[0-3]-(off|corrected)\.json": "[0-9a-f]{64}"''',
  '''^    "(harness|campaign_scorer|token_scorer_sha256|cgroup|safe|memory_guard|binary|tokenizer_sha256|tokenizers_init_sha256|tokenizers_so_sha256|ds4\.c|ds4_cuda\.cu|ds4_cli\.c|Makefile|test_binary|tests/test_glm_mtp_proxy_contract\.c|tests/test_glm_mtp_proxy_cli\.py|tests/test_gpu_expert_slot_dispatch_marker\.sh|tests/test_gpu_expert_slot_lifetime\.c|tests/test_gpu_expert_slot_gemv\.c|tests/test_instance_lock_safety\.sh)": "[0-9a-f]{64}"[,]?$''',
]
